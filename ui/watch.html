<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#0a0b0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>一起看 · 观看</title>
    <style>
        :root {
            --bg: #0a0b0f;
            --panel: rgba(255, 255, 255, .04);
            --line: rgba(255, 255, 255, .08);
            --fg: #f1f5f9;
            --fg-2: #94a3b8;
            --accent: #7c6bff;
            --accent-2: #4f8cff;
            --ok: #22c55e;
            --warn: #f59e0b;
            --danger: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body,
        #app {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit
        }

        input {
            font-family: inherit
        }

        .page {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000
        }

        /* 视频铺满 */
        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* 顶栏 */
        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, rgba(0, 0, 0, .7), transparent);
            transition: opacity .2s;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 16px;
            transition: transform .15s, background .15s;
        }

        .icon-btn:active {
            transform: scale(.92);
            background: rgba(255, 255, 255, .14)
        }

        .chip {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            flex: none
        }

        .dot.ok {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok)
        }

        .dot.warn {
            background: var(--warn);
            box-shadow: 0 0 8px var(--warn);
            animation: blink 1.4s infinite
        }

        .dot.err {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger)
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        /* 覆盖层 */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(700px 400px at 50% 0%, rgba(124, 107, 255, .2), transparent 60%),
                rgba(0, 0, 0, .78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 26px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .05);
        }

        .panel h2 {
            margin: 4px 0 0;
            font-size: 19px;
            font-weight: 700
        }

        .panel p {
            margin: 0;
            font-size: 13px;
            color: var(--fg-2)
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 12px 30px -8px rgba(124, 107, 255, .7);
            transition: transform .15s;
        }

        .btn-primary:active {
            transform: scale(.98)
        }

        .btn-primary:disabled {
            opacity: .5;
            box-shadow: none
        }

        .panel-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--fg);
            font-size: 16px;
            text-align: center;
            letter-spacing: .04em;
            outline: none;
            transition: border-color .2s, background .2s;
        }

        .panel-input:focus {
            border-color: var(--accent);
            background: rgba(124, 107, 255, .08)
        }

        .spin {
            width: 42px;
            height: 42px;
            margin: 8px auto;
            border-radius: 50%;
            border: 3px solid rgba(124, 107, 255, .18);
            border-top-color: var(--accent);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* 播放按钮 */
        .play-fab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            padding: 20px;
        }

        .play-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            animation: ripple 2s infinite;
        }

        .play-fab p {
            margin: 0;
            color: #fff;
            font-size: 15px;
            font-weight: 600
        }

        @keyframes ripple {
            0% {
                box-shadow: 0 20px 50px -10px rgba(124, 107, 255, .8), 0 0 0 0 rgba(124, 107, 255, .5)
            }

            100% {
                box-shadow: 0 20px 50px -10px rgba(124, 107, 255, .8), 0 0 0 30px rgba(124, 107, 255, 0)
            }
        }

        /* 取消静音 */
        .unmute-fab {
            position: absolute;
            right: 16px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            z-index: 20;
            padding: 12px 20px;
            border-radius: 30px;
            background: var(--danger);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px -6px rgba(255, 77, 109, .6);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.04)
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="page">
            <video id="remoteVideo" playsinline webkit-playsinline autoplay @click="toggleControls"></video>

            <!-- 顶栏 -->
            <div class="topbar" v-show="showControls || !playing">
                <div class="chip">
                    <span class="dot" :class="dotClass"></span>
                    <span>{{ roomId || '未加入' }}</span>
                    <span v-if="statusLabel" style="color:var(--fg-2)">· {{ statusLabel }}</span>
                </div>
            </div>

            <!-- 取消静音 -->
            <button v-if="hasMedia && muted && playing" class="unmute-fab" @click="unmute">
                🔇 点击开启声音
            </button>

            <!-- 覆盖层 -->
            <div v-if="!playing" class="overlay">
                <!-- 未加入 -->
                <div v-if="!joined" class="panel">
                    <h2>加入房间</h2>
                    <p>输入电脑端显示的房间号</p>
                    <input v-model="inputRoom" class="panel-input" placeholder="房间号" @keyup.enter="enter">
                    <button class="btn-primary" :disabled="!inputRoom.trim()" @click="enter">
                        进入房间
                    </button>
                </div>

                <!-- 等待 / 连接中 -->
                <div v-else-if="!hasMedia" class="panel">
                    <div class="spin"></div>
                    <h2 style="font-size:16px">{{ statusLabel || '等待主播投屏…' }}</h2>
                    <p>请保持此页面打开</p>
                </div>

                <!-- 需要手势播放 -->
                <div v-else class="play-fab" @click="userPlay">
                    <div class="play-circle">
                        <svg viewBox="0 0 48 48" width="40" height="40">
                            <path d="M16 12 L36 24 L16 36 Z" fill="currentColor" />
                        </svg>
                    </div>
                    <p>点击开始播放</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ];
        const CLIENT_ID = Math.random().toString(36).slice(2, 10);
        const WS_BASE = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

        function addIce(pc, candidate) {
            if (!candidate) return Promise.resolve();
            const c = new RTCIceCandidate(candidate);
            if (!pc.remoteDescription) {
                pc._pending = pc._pending || [];
                pc._pending.push(c); return Promise.resolve();
            }
            return pc.addIceCandidate(c).catch(() => { });
        }
        async function flushIce(pc) {
            const q = pc._pending || []; pc._pending = [];
            for (const c of q) { try { await pc.addIceCandidate(c) } catch (e) { } }
        }

        createApp({
            setup() {
                const params = new URLSearchParams(location.search);
                const roomId = ref(params.get('room') || localStorage.getItem('wt:last-room') || '');
                const inputRoom = ref(roomId.value);
                const joined = ref(false);
                const status = ref('idle');
                const hasMedia = ref(false);
                const playing = ref(false);
                const muted = ref(true);
                const showControls = ref(true);

                let ws = null, pc = null;
                let hideTimer = null;

                const statusLabel = computed(() => ({
                    connecting: '连接中', waiting: '等待主播', connected: '', failed: '连接失败',
                }[status.value] || ''));

                const dotClass = computed(() => ({
                    ok: status.value === 'connected',
                    warn: status.value === 'connecting' || status.value === 'waiting',
                    err: status.value === 'failed',
                }));

                function getVideo() { return document.getElementById('remoteVideo') }

                function unlockAudio() {
                    try {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        const ctx = new AC();
                        if (ctx.state === 'suspended') ctx.resume();
                        const buf = ctx.createBuffer(1, 1, 22050);
                        const src = ctx.createBufferSource();
                        src.buffer = buf; src.connect(ctx.destination); src.start(0);
                        setTimeout(() => { try { ctx.close() } catch (e) { } }, 300);
                    } catch (e) { }
                }

                async function tryAutoPlay() {
                    const v = getVideo(); if (!v) return;
                    try {
                        v.muted = false; v.volume = 1;
                        await v.play();
                        playing.value = true; muted.value = false;
                    } catch (e) {
                        try {
                            v.muted = true; await v.play();
                            playing.value = true; muted.value = true;
                        } catch (e2) { playing.value = false }
                    }
                }

                async function userPlay() {
                    unlockAudio();
                    const v = getVideo(); if (!v) return;
                    v.muted = false; v.volume = 1;
                    try { await v.play(); playing.value = true; muted.value = false } catch (e) { }
                }

                async function unmute() {
                    const v = getVideo(); if (!v) return;
                    v.muted = false; muted.value = false;
                    try { await v.play() } catch (e) { }
                }

                function toggleControls() {
                    if (!playing.value) return;
                    showControls.value = !showControls.value;
                    clearTimeout(hideTimer);
                    if (showControls.value) hideTimer = setTimeout(() => showControls.value = false, 3500);
                }

                function send(msg) {
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
                }

                async function handleOffer(sdp) {
                    if (!pc) {
                        pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
                        pc.ontrack = e => {
                            const v = getVideo(); if (!v) return;
                            const stream = (e.streams && e.streams[0]) || null;
                            if (stream) { if (v.srcObject !== stream) v.srcObject = stream }
                            else {
                                let s = v.srcObject;
                                if (!(s instanceof MediaStream)) { s = new MediaStream(); v.srcObject = s }
                                s.addTrack(e.track);
                            }
                            hasMedia.value = true;
                            tryAutoPlay();
                        };
                        pc.onicecandidate = e => {
                            if (e.candidate) send({ type: 'ice', candidate: e.candidate });
                        };
                        pc.onconnectionstatechange = () => {
                            if (!pc) return;
                            if (pc.connectionState === 'connected') status.value = 'connected';
                            else if (pc.connectionState === 'failed') status.value = 'failed';
                        };
                    }
                    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
                    await flushIce(pc);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    send({
                        type: 'answer',
                        sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
                    });
                }

                function join(room) {
                    roomId.value = room;
                    localStorage.setItem('wt:last-room', room);
                    joined.value = true;
                    status.value = 'connecting';
                    unlockAudio();

                    ws = new WebSocket(`${WS_BASE}/ws/${encodeURIComponent(room)}/viewer/${CLIENT_ID}`);
                    ws.onopen = () => status.value = 'waiting';
                    ws.onclose = () => { playing.value = false; status.value = 'failed' };
                    ws.onmessage = async ev => {
                        let msg; try { msg = JSON.parse(ev.data) } catch (e) { return }
                        if (msg.type === 'offer') await handleOffer(msg.sdp);
                        else if (msg.type === 'ice') { if (pc) await addIce(pc, msg.candidate) }
                        else if (msg.type === 'broadcaster-left') {
                            playing.value = false; status.value = 'waiting';
                            const v = getVideo(); if (v) v.srcObject = null;
                            hasMedia.value = false;
                        }
                    };
                }

                function enter() {
                    const r = inputRoom.value.trim();
                    if (r) join(r);
                }

                onMounted(() => {
                    if (roomId.value) join(roomId.value);
                });

                return {
                    roomId, inputRoom, joined, status, hasMedia, playing, muted, showControls,
                    statusLabel, dotClass, enter, userPlay, unmute, toggleControls,
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
